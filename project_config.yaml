# GluePlex Project Configuration

# General Settings
project_name: "Result_VAV1_CRBN"
base_dir: "/home/hlin/GluePlex"

# Step 1: PeSTo
# Target PDB ID or Path
# If using ID, it will be fetched. If using path, it must exist.
target_pdb: "./VAV1_af2.pdb" 

# Step 2: HADDOCK3
# Partner 2 is fixed to CRBN_pesto.pdb (assumed to be in base_dir)
# Active residues for Target (Partner 1)
# If empty, they will be fetched using 2.0 logic (not yet fully integrated, so provide them for now)
# Example for 1E9H_A: "30,31,32,33" (Just an example, please update with real values)

target_active_res: "1,3,9,10,11,13,14,15,16,17,18,19,21,24,32,34,35,36,37,38,39,41,50,53,54,55" 

# HADDOCK3 Run Directory
haddock_run_dir: "haddock_results"
haddock_ncores: 80

# Step 3: Boltz
step3:
  protein_a_name: "CRBN"
  protein_a_sequence: ""
  protein_b_name: "VAV1"
  protein_b_sequence: "KYFGTAKARYDFCARDRSELSLKEGDIIKILNKKGQQGWWRGEIYGRVGWFPANYVEEDYS"
  ligand_name: "NGT-201-12"
  ligand_smiles: "O=C1CCC(c2cccc(-c3ccc4[nH]ccc4c3)c2)C(=O)N1"

  diffusion_samples: 20
  gpus: [0,1,2,3,4,5,6,7] # List of GPU IDs to use

